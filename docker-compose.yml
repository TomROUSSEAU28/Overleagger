# Self-hosted Circuit Notebook: web app + real-time collaboration server.
#   docker compose up -d          then open http://localhost:8787
services:
  circuit-notebook:
    build: .
    image: circuit-notebook
    restart: unless-stopped
    ports:
      - '8787:8787'
    volumes:
      - circuit-notebook-data:/data
    environment:
      # Public address of this server (used in invite links and GitHub sign-in).
      PUBLIC_URL: http://localhost:8787
      # Set to "false" to allow new accounts only through invite links.
      ALLOW_SIGNUP: 'true'
      # Optional GitHub sign-in (create an OAuth app, callback: <PUBLIC_URL>/api/auth/github/callback)
      # GITHUB_CLIENT_ID: ...
      # GITHUB_CLIENT_SECRET: ...
      # If the web app is hosted elsewhere (e.g. GitHub Pages), allow its origin:
      # CORS_ORIGINS: https://you.github.io
      # Behind a reverse proxy or Cloudflare Tunnel (real visitor IPs for the login throttle):
      # TRUST_PROXY: 'true'
      # Accounts that see the Administration page (comma separated; "@domain" = a whole domain):
      # ADMIN_EMAILS: you@example.com
      # Beta limits: projects each account keeps on the server, and MB per project.
      # MAX_PROJECTS: '5'
      # MAX_PROJECT_MB: '5'
      # Contact form of the homepage: messages are e-mailed there (needs SMTP, e.g. Brevo).
      # CONTACT_EMAIL: contact@example.com
      # SMTP_HOST: smtp-relay.brevo.com
      # SMTP_PORT: '587'
      # SMTP_USER: ...
      # SMTP_PASS: ...
      # SMTP_FROM: Circuit Notebook <contact@example.com>

volumes:
  circuit-notebook-data:
