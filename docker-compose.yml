# Self-hosted SchemaBoard: web app + real-time collaboration server.
#   docker compose up -d          then open http://localhost:8787
services:
  schemaboard:
    build: .
    image: schemaboard
    restart: unless-stopped
    ports:
      - '8787:8787'
    volumes:
      - schemaboard-data:/data
    environment:
      # Public address of this server (used in invite links and GitHub sign-in).
      PUBLIC_URL: http://localhost:8787
      # Set to "false" to allow new accounts only through invite links.
      ALLOW_SIGNUP: 'true'
      # Optional GitHub sign-in (create an OAuth app, callback: <PUBLIC_URL>/api/auth/github/callback)
      # GITHUB_CLIENT_ID: ...
      # GITHUB_CLIENT_SECRET: ...
      # If the web app is hosted elsewhere (e.g. GitHub Pages), allow its origin:
      # CORS_ORIGINS: https://you.github.io

volumes:
  schemaboard-data:
